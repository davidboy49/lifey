# Production stack for a shared VPS: nginx already owns 80/443, so every port
# here is bound to loopback and each container has a memory ceiling.
# Images are built by deploy/deploy.sh (memory-capped), not by compose.
name: lifey

services:
  db:
    image: postgres:18
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: lifey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/deploy.sh once to create .env}
      POSTGRES_DB: lifey
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5439:5432"   # for ssh-tunnelled imports only
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifey"]
      interval: 5s
      retries: 12

  api:
    image: lifey-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Sure network its web container is reachable by name.
      # (The importer's own .env says 127.0.0.1:8099, which is the host.)
      SURE_API_URL: http://sure-web-1:3000
    volumes:
      - /opt/sure_import:/opt/sure_import:ro
    networks: [default, sure]
    ports:
      - "127.0.0.1:8101:8000"
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy

  # --- started explicitly by deploy/cutover.sh (profiles keep them out of `up -d`) ---

  # The Telegram bot. Only one process may poll a token, so this must never run
  # alongside the old telegram-bot.service.
  bot:
    image: lifey-api:latest
    profiles: ["bot"]
    restart: unless-stopped
    env_file: .env
    environment:
      SURE_API_URL: http://sure-web-1:3000
    command: ["python", "-m", "app.bot"]
    volumes:
      - /opt/sure_import:/opt/sure_import:ro
    networks: [default, sure]
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy

  # One-shot Garmin sync, run by lifey-sync.timer:  compose run --rm sync smart 3
  sync:
    image: lifey-api:latest
    profiles: ["sync"]
    env_file: .env
    environment:
      GARMIN_TOKEN_DIR: /data/garmin_tokens
    entrypoint: ["python", "-m", "app.health.sync"]
    command: ["smart", "3"]
    volumes:
      - garmin:/data
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy

  web:
    image: lifey-web:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:8100:3000"
    mem_limit: 256m
    depends_on:
      - api

networks:
  sure:
    name: sure_sure_net
    external: true

volumes:
  garmin:
  pgdata:
