# nginx vhost for Lifey, following the pattern of the existing health.* site:
# TLS by certbot, basic auth in front, everything proxied to the web container
# (Next.js forwards /api/* to the API itself).
#
#   1. htpasswd -c /etc/nginx/.htpasswd-lifey <user>
#   2. cp deploy/nginx-lifey.conf /etc/nginx/sites-available/lifey
#      ln -s /etc/nginx/sites-available/lifey /etc/nginx/sites-enabled/lifey
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d lifey.fearlessonline.shop
server {
    server_name lifey.fearlessonline.shop;
    listen 80;

    client_max_body_size 12m;   # bank statement uploads

    location / {
        auth_basic "Lifey";
        auth_basic_user_file /etc/nginx/.htpasswd-lifey;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
