# nginx vhost for Lifey. Authentication is done by the app itself (sessions,
# Argon2id, lockout), so there is no basic-auth layer here. nginx adds TLS and a
# per-IP rate limit on the login endpoint as a second line of defence.
#
#   1. cp deploy/nginx-lifey.conf /etc/nginx/sites-available/lifey
#      ln -s /etc/nginx/sites-available/lifey /etc/nginx/sites-enabled/lifey
#   2. nginx -t && systemctl reload nginx
#   3. certbot --nginx -d lifey.fearlessonline.shop
#   4. create the account:  docker compose -f compose.prod.yml exec api python -m app.auth.cli create-user <name>

# Behind Cloudflare every client shares a few edge IPs, so key on the real one.
map $http_cf_connecting_ip $lifey_client {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $lifey_client zone=lifey_login:10m rate=10r/m;

server {
    server_name lifey.fearlessonline.shop;
    listen 80;

    client_max_body_size 12m;   # bank statement uploads

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/auth/login {
        limit_req zone=lifey_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Claude connector (remote MCP + OAuth). These go straight to the API; the
    # rest of the site goes through the web app. Only active when ENABLE_MCP=1.
    location ~ ^/(mcp|authorize|token|register|revoke)$ {
        limit_req zone=lifey_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300;
    }

    location ^~ /oauth/ {
        limit_req zone=lifey_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/oauth- {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
