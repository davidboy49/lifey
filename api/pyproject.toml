[project]
name = "lifey-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "garminconnect==0.3.8",
  "argon2-cffi>=23.1",
  "openpyxl>=3.1",  # the bank statement importer reads .xlsx
  "tzdata",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]
import = ["pgdumplib>=3.1"]
bot = ["python-telegram-bot[job-queue]>=22.5", "pandas>=2.2", "numpy>=2.0"]
# Your notebook environment only. Never installed in the production image.
ml = ["pandas>=2.2", "numpy>=2.0", "scikit-learn>=1.5", "lightgbm>=4.5", "shap>=0.46",
      "matplotlib>=3.9", "joblib>=1.4", "jupyterlab>=4.2", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
